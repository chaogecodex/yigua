<script type="application/json" id="data">{"111111":{"n":1,"name":"乾","sym":"䷀","lo":"乾","hi":"乾","gua":"元亨，利貞。","lines":["初九：潛龍勿用。","九二：見龍在田，利見大人。","九三：君子終日乾乾，夕惕若厲。无咎。","九四：或躍在淵，无咎。","九五：飛龍在天，利見大人。","上九：亢龍，有悔。"],"use":"用九：見群龍无首，吉。","xiang":"天行健，君子以自強不息。","bh":{"gua":["开创亨通，利于坚守正道。","大方向对，放手去做，但守住原则。"],"lines":[["龙还潜在水底，暂时不要用。","时机未到，先积蓄实力。"],["龙出现在田野，适合拜见贵人。","开始露头角，多接触能帮你的人。"],["君子整天勤勉，夜里仍警惕，虽有危险却无过错。","忙归忙，睡前复盘一下就不会出错。"],["或许跃起，或许退回深渊，都没有过错。","可以试一试，不行就退回来。"],["龙飞在天上，适合拜见贵人。","正是最好的时候，大胆展示自己。"],["龙飞过了头，会有后悔。","见好就收，别把事做绝。"]],"use":["群龙都不争当首领，吉。","别抢风头，合作反而更顺。"]}},"000000":{"n":2,"name":"坤","sym":"䷁","lo":"坤","hi":"坤","gua":"元亨。利牝馬之貞。君子有攸往，先迷後得主，利，西南得朋，東北喪朋。安貞吉。","lines":["初六：履霜、堅冰至。","六二：直、方、大，不習无不利。","六三：含章可貞，或從王事，无成有終。","六四：括囊，无咎无譽。","六五：黃裳元吉。","上六：龍戰于野，其血玄黃。"],"use":"用六：利永貞。","xiang":"地勢坤。君子以厚德載物。","bh":{"gua":["亨通，像母马一样柔顺而坚持有利；先迷路后找到主导，西南得友、东北失友，安守正道吉。","跟对人、做好配角，稳着来。"],"lines":[["踩到霜，就知道坚冰要来了。","小苗头要早处理，别等它变大。"],["正直、端方、宏大，不刻意练习也无所不利。","做人坦荡，自然顺利。"],["藏着才华可以守正，跟随做事，不居功而有好结果。","低调出力，功劳不急着领。"],["扎紧口袋，没有过错也没有称赞。","少说话，守住就好。"],["穿黄色的下裳，大吉。","谦和守中，好运自来。"],["龙在野外争斗，流出黑黄的血。","硬碰硬两败俱伤，退一步。"]],"use":["利于长久守正。","坚持长期主义。"]}},"100010":{"n":3,"name":"屯","sym":"䷂","lo":"震","hi":"坎","gua":"元亨，利貞。勿用有攸往。利建侯。","lines":["初九：磐桓。利居貞。利建侯。","六二：屯如邅如，乘馬班如。匪寇，婚媾。女子貞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子幾不如舍，往吝。","六四：乘馬班如，求婚媾。往吉，无不利。","九五：屯其膏，小貞吉，大貞凶。","上六：乘馬班如，泣血漣如。"],"use":null,"xiang":"雲雷、屯。君子以經綸。","bh":{"gua":["起始亨通，利于守正；先别急着出行，适合建立根基。","万事开头难，先打地基。"],"lines":[["徘徊不前，适合安守正道、建立根基。","先站稳，不必急进。"],["进退艰难，骑马盘旋；不是强盗是来求婚的，女子守贞不嫁，十年才嫁。","看似麻烦其实是好事，只是要等。"],["追鹿没有向导，只会迷入林中；君子知机不如放弃，硬去会难堪。","没准备的事别硬上。"],["骑马盘旋，前去求婚，前往吉，无所不利。","主动一点，会有回应。"],["恩泽积聚难以施展，小事守正吉，大事守正凶。","小事可做，大动作先缓。"],["骑马徘徊，哭得血泪涟涟。","别钻牛角尖，换条路走。"]],"use":null}},"010001":{"n":4,"name":"蒙","sym":"䷃","lo":"坎","hi":"艮","gua":"亨。匪我求童蒙，童蒙來求我。初筮告，再三瀆，瀆則不告。利貞。","lines":["初六：發蒙，利用刑人，用說桎梏，以往吝。","九二：苞蒙，吉。納婦吉。子克家。","六三：勿用取女，見金夫，不有躬。无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：擊蒙，不利為寇，利禦寇。"],"use":null,"xiang":"山下出泉，《蒙》。君子以果行育德。","bh":{"gua":["亨通；不是我求蒙童，是蒙童来求我；初次问给答案，一问再问是亵渎，不再回答；利于守正。","诚心问一次就好，反复纠结没用。"],"lines":[["启蒙时宜用规矩约束，再解除枷锁；一味放任下去会难堪。","先立规矩，再给自由。"],["包容蒙昧的人，吉；娶妻吉，儿子能持家。","宽容待人，身边人会成长。"],["不要娶这女子，她见到有钱人就失了自持，无所利。","看人看本心，别被表面迷惑。"],["困于蒙昧，难堪。","卡住了就去请教别人。"],["像孩童一样虚心，吉。","放下身段去学。"],["敲打蒙昧，不宜过于强横，宜于防御侵害。","教训要有度，防守优先。"]],"use":null}},"111010":{"n":5,"name":"需","sym":"䷄","lo":"乾","hi":"坎","gua":"有孚，光亨。貞吉。利涉大川。","lines":["初九：需于郊，利用恆，无咎。","九二：需于沙，小有言，終吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，貞吉。","上六：入于穴，有不速之客三人來，敬之終吉。"],"use":null,"xiang":"雲上於天，《需》。君子以飲食宴樂。","bh":{"gua":["有诚信，光明亨通，守正吉，利于渡大河。","耐心等待，时机会来。"],"lines":[["在郊外等待，保持恒心，没有过错。","离风险远一点，稳稳地等。"],["在沙滩上等待，有些闲话，终归吉。","别理闲话，结果是好的。"],["在泥地里等待，招来了盗寇。","别在危险边缘停留。"],["在血泊中等待，从洞穴中脱身。","处境虽险，顺势能脱身。"],["在酒食中等待，守正吉。","该吃吃该喝喝，安心等。"],["进入洞穴，来了三位不请自来的客人，恭敬对待终吉。","意外来人，客气接待就是转机。"]],"use":null}},"010111":{"n":6,"name":"訟","sym":"䷅","lo":"坎","hi":"乾","gua":"有孚窒，惕，中吉，終凶。利見大人。不利涉大川。","lines":["初六：不永所事，小有言，終吉。","九二：不克訟，歸而逋其邑，人三百戶无眚。","六三：食舊德，貞厲，終吉。或從王事无成。","九四：不克訟，復即命，渝。安貞吉。","九五：訟元吉。","上九：或錫之鞶、帶，終朝三褫之。"],"use":null,"xiang":"天與水違行，《訟》。君子以作事謀始。","bh":{"gua":["有诚信却受阻，心存警惕，适可而止则吉，争到底则凶；利见大人，不利渡大河。","能和解就和解，别死磕。"],"lines":[["不把争执拖长，虽有些闲话，终归吉。","早点收手。"],["争不赢，回去躲到小城，三百户人家都没有灾祸。","认输回撤，保住基本盘。"],["靠旧有的德业过活，守正有危但终吉；跟着做事不居功。","吃老本也行，低调点。"],["争不赢，回头接受命令，改变态度，安守正道吉。","换个态度，局面就变好。"],["争讼得到公正裁决，大吉。","找对的人评理，能赢。"],["就算赏了腰带，一天之内也会被剥夺三次。","争来的东西留不住。"]],"use":null}},"010000":{"n":7,"name":"師","sym":"䷆","lo":"坎","hi":"坤","gua":"貞丈人吉，无咎。","lines":["初六：師出以律，否臧凶。","九二：在師中，吉、无咎，王三錫命。","六三：師或輿尸，凶。","六四：師左次，无咎。","六五：田有禽。利執言，无咎。長子帥師，弟子輿尸，貞凶。","上六：大君有命，開國承家，小人勿用。"],"use":null,"xiang":"地中有水，《師》。君子以容民畜眾。","bh":{"gua":["守正，由德高望重者统领则吉，没有过错。","找靠谱的人带队。"],"lines":[["出兵要有纪律，不守纪律就凶。","先定规则再行动。"],["在军中居中统率，吉而无过，君王多次嘉奖。","承担责任会被认可。"],["军队或许要用车运尸而归，凶。","这件事别冒进。"],["军队暂时后退驻扎，没有过错。","战略性撤退不丢人。"],["田里有野兽，宜于捕捉，无过；长子统兵可以，让次子带兵会载尸而归，守正也凶。","用对人最重要。"],["君王下令封国赐家，不可任用小人。","论功行赏，远离小人。"]],"use":null}},"000010":{"n":8,"name":"比","sym":"䷇","lo":"坤","hi":"坎","gua":"吉。原筮元，永貞无咎。不寧方來，後夫凶。","lines":["初六：有孚比之，无咎。有孚盈缶，終來，有它吉。","六二：比之自內，貞吉。","六三：比之匪人。","六四：外比之，貞吉。","九五：顯比，王用三驅，失前禽，邑人不誡，吉。","上六：比之无首，凶。"],"use":null,"xiang":"地上有水，《比》。先王以建萬國，親諸侯。","bh":{"gua":["吉；再三斟酌，从根本上长久守正则无过；不安的人纷纷来归，迟来的凶。","亲近对的人，别拖。"],"lines":[["诚信地亲附，没有过错；诚信像满缸的水，终会有意外之吉。","真诚待人，回报在后头。"],["从内心亲附，守正吉。","和身边的人搞好关系。"],["亲附了不该亲附的人。","交友要慎重。"],["向外亲附贤者，守正吉。","多向高手靠近。"],["光明正大的亲附；君王打猎三面驱赶，放走前面的禽兽，百姓不必戒备，吉。","来去自由，人心自然归附。"],["亲附却没有带头人，凶。","群龙无首，先找主心骨。"]],"use":null}},"111011":{"n":9,"name":"小畜","sym":"䷈","lo":"乾","hi":"巽","gua":"亨。密雲不雨，自我西郊。","lines":["初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿說輻。夫妻反目。","六四：有孚血去惕出，无咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載。婦貞厲。月幾望，君子征凶。"],"use":null,"xiang":"風行天上，《小畜》。君子以懿文德。","bh":{"gua":["亨通；浓云密布却不下雨，从我的西郊升起。","快成了，还差一点火候。"],"lines":[["回到自己的道路，有什么过错，吉。","回归本心就对了。"],["被牵引着回来，吉。","跟着朋友回头，没错。"],["车子脱了辐条，夫妻反目。","先处理好内部矛盾。"],["有诚信，免去伤害、脱离忧惧，没有过错。","真诚能化解紧张。"],["诚信相连，与邻居共同富裕。","有好处一起分。"],["雨已下、已停，德行积满；妇人守正有危，月近圆时，君子出行凶。","满了就停，别再往前冲。"]],"use":null}},"110111":{"n":10,"name":"履","sym":"䷉","lo":"兌","hi":"乾","gua":"履虎尾，不咥人。亨。","lines":["初九：素履往，无咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾，咥人凶。武人為于大君。","九四：履虎尾愬愬，終吉。","九五：夬履貞厲。","上九：視履考祥，其旋，元吉。"],"use":null,"xiang":"上天下澤，《履》。君子以辯上下，定民志。","bh":{"gua":["踩在老虎尾巴上，老虎不咬人，亨通。","小心谨慎，险中也能过。"],"lines":[["朴素地前行，没有过错。","按本色做事就好。"],["走在平坦的大道上，安静自守的人守正吉。","低调走自己的路。"],["瞎了一只眼也想看，跛了脚也想走，踩到虎尾被咬，凶；武夫想当君王。","别高估自己。"],["踩着虎尾，战战兢兢，终归吉。","怕是对的，谨慎就能过关。"],["果断地前行，守正也有危险。","果断可以，别莽撞。"],["回顾走过的路考察吉凶，周全回旋，大吉。","复盘一下，下一步更顺。"]],"use":null}},"111000":{"n":11,"name":"泰","sym":"䷊","lo":"乾","hi":"坤","gua":"小往大來，吉，亨。","lines":["初九：拔茅茹以其彙。征吉。","九二：苞荒，用馮河，不遐遺。朋亡，得尚于中行。","九三：无平不陂，无往不復。艱貞，无咎。勿恤其孚，于食有福。","六四：翩翩，不富以其鄰，不戒以孚。","六五：帝乙歸妹，以祉，元吉。","上六：城復于隍，勿用師，自邑告命、貞吝。"],"use":null,"xiang":"天地交，《泰》。后以財成天地之道，輔相天地之宜，以左右民。","bh":{"gua":["小的去、大的来，吉而亨通。","好运期，顺着走。"],"lines":[["拔茅草连根带出同类，前往吉。","拉上伙伴一起干。"],["包容荒远，敢于徒步过河，不遗弃远方，不结私党，能合于中道。","格局大一点，不拉帮结派。"],["没有平地不变成斜坡，没有去而不返；艰难中守正无过，不必担心诚信，自有口福。","顺境也会有波折，稳住就好。"],["轻快地下来，不靠富有也能联合邻居，彼此信任不需戒备。","放下身段，大家自然信你。"],["帝乙嫁出妹妹，带来福分，大吉。","结下好缘分，福气跟着来。"],["城墙倒塌落回壕沟，不要用兵，只在城中发布命令，守正也难堪。","盛极转衰，收缩守住。"]],"use":null}},"000111":{"n":12,"name":"否","sym":"䷋","lo":"坤","hi":"乾","gua":"否之匪人。不利君子貞。大往小來。","lines":["初六：拔茅茹，以其彙。貞吉亨。","六二：苞承，小人吉，大人否。亨。","六三：苞羞。","九四：有命，无咎，疇離祉。","九五：休否，大人吉。其亡其亡，繫于苞桑。","上九：傾否，先否後喜。"],"use":null,"xiang":"天地不交，《否》。君子以儉德辟難，不可榮以祿。","bh":{"gua":["闭塞不通，不合人道；不利君子守正，大的去、小的来。","运气低迷，少动为妙。"],"lines":[["拔茅草连根带出同类，守正吉，亨通。","和同道抱团守住。"],["包容顺承，小人吉；君子身处闭塞反而亨通。","守住底线，不同流合污。"],["心里包藏着羞耻。","心虚的事别做。"],["身负使命没有过错，同类都能沾福。","扛起责任，大家受益。"],["闭塞将要停止，大人吉；时时想着\"要亡了\"，就像系在桑树根上一样稳固。","居安思危才稳。"],["闭塞被推翻，先难后喜。","低谷快过去了。"]],"use":null}},"101111":{"n":13,"name":"同人","sym":"䷌","lo":"離","hi":"乾","gua":"同人于野，亨。利涉大川。利君子貞。","lines":["初九：同人于門，无咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人先號咷而後笑，大師克，相遇。","上九：同人于郊，无悔。"],"use":null,"xiang":"天與火、《同人》。君子以類族辨物。","bh":{"gua":["在郊野与人和同，亨通，利于渡大河，利于君子守正。","敞开合作，事情能成。"],"lines":[["一出门就与人和同，没有过错。","主动出去交朋友。"],["只在宗族内部和同，难堪。","别只待在小圈子里。"],["在草莽中埋伏兵马，登上高坡观望，三年不敢起事。","暗中较劲不会有结果。"],["登上城墙却没有进攻，吉。","能攻而不攻，是智慧。"],["与人和同，先哭后笑，大军得胜后会合。","先难后易，终会团聚。"],["在郊外与人和同，没有悔恨。","虽不热闹，无愧就好。"]],"use":null}},"111101":{"n":14,"name":"大有","sym":"䷍","lo":"乾","hi":"離","gua":"元亨。","lines":["初九：无交害，匪咎、艱則无咎。","九二：大車以載，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如吉。","上九：自天祐之，吉无不利。"],"use":null,"xiang":"火在天上，《大有》。君子以遏惡揚善，順天休命。","bh":{"gua":["大为亨通。","收获期，好好把握。"],"lines":[["不牵涉祸害，本无过错，记得艰难就不会有过错。","富了也别忘了艰难。"],["大车装满东西，前往没有过错。","能力够，可以扛大事。"],["公侯向天子献礼，小人做不到。","好东西要用在正道上。"],["不过分张扬盛大，没有过错。","低调，别炫耀。"],["以诚信相交，又有威严，吉。","亲和又有原则。"],["上天保佑，吉而无所不利。","顺风顺水。"]],"use":null}},"001000":{"n":15,"name":"謙","sym":"䷎","lo":"艮","hi":"坤","gua":"亨。君子有終。","lines":["初六：謙謙君子，用涉大川，吉。","六二：鳴謙，貞吉。","九三：勞謙，君子有終、吉。","六四：无不利，撝謙。","六五：不富以其鄰，利用侵伐，无不利。","上六：鳴謙，利用行師征邑國。"],"use":null,"xiang":"地中有山，《謙》。君子以裒多益寡，稱物平施。","bh":{"gua":["亨通，君子会有好结果。","谦虚就是最好的运气。"],"lines":[["谦而又谦的君子，可以渡大河，吉。","越谦虚越能成大事。"],["谦虚的名声远扬，守正吉。","好口碑来自真谦虚。"],["有功劳仍谦虚的君子，有好结果，吉。","做了事不居功，更得人心。"],["无所不利，发挥谦德。","处处谦和，事事顺利。"],["不靠富有而能团结邻居，利于征讨不服，无所不利。","该硬的时候也要硬。"],["谦名远扬，可以出兵征讨城邑。","有人望了，就可以出手。"]],"use":null}},"000100":{"n":16,"name":"豫","sym":"䷏","lo":"坤","hi":"震","gua":"利建侯行師。","lines":["初六：鳴豫，凶。","六二：介于石，不終日，貞吉。","六三：盱豫，悔，遲有悔。","九四：由豫，大有得，勿疑。朋盍簪。","六五：貞疾，恆不死。","上六：冥豫成，有渝、无咎。"],"use":null,"xiang":"雷出地奮，《豫》。先王以作樂崇德，殷薦之上帝以配祖考。","bh":{"gua":["利于建立诸侯、出兵。","心情好的时候，适合开局。"],"lines":[["得意地张扬快乐，凶。","别太得意忘形。"],["坚如磐石，不用等到一天结束就能明白，守正吉。","见机要快，立刻行动。"],["仰人鼻息求快乐，会后悔，迟疑也会后悔。","别讨好别人，也别拖。"],["快乐由他而来，大有收获，不必怀疑，朋友像簪子束发一样聚拢。","你是核心，大家围着你转。"],["守正却有病，长久拖着但不会死。","小毛病拖着，但不致命。"],["沉迷享乐已成，若能改变就没有过错。","及时回头就没事。"]],"use":null}},"100110":{"n":17,"name":"隨","sym":"䷐","lo":"震","hi":"兌","gua":"元亨，利貞，无咎。","lines":["初九：官有渝，貞吉，出門交有功。","六二：係小子，失丈夫。","六三：係丈夫，失小子，隨有求、得。利居貞。","九四：隨有獲，貞凶。有孚在道，以明，何咎？","九五：孚于嘉、吉。","上六：拘係之乃從，維之，王用亨于西山。"],"use":null,"xiang":"澤中有雷，《隨》。君子以嚮晦入宴息。","bh":{"gua":["大为亨通，利于守正，没有过错。","跟随对的人和事，顺势而为。"],"lines":[["主张有所改变，守正吉，出门交往会有功。","换个思路，多出去走走。"],["依附小子，失去了丈夫。","跟错了人，会丢掉大的。"],["依附丈夫，失去了小子；跟随有求必得，利于安居守正。","选大舍小，是对的。"],["跟随中有所获，守正也凶；心存诚信合于正道，光明磊落，有什么过错。","有收获别独占，坦荡就没事。"],["对美善怀有诚信，吉。","相信好的人和事。"],["拘系住才顺从，再用绳子捆住；君王在西山祭祀。","强扭的也能成，但要用心。"]],"use":null}},"011001":{"n":18,"name":"蠱","sym":"䷑","lo":"巽","hi":"艮","gua":"元亨。利涉大川，先甲三日，後甲三日。","lines":["初六：幹父之蠱，有子，考无咎，厲終吉。","九二：幹母之蠱，不可貞。","九三：幹父之蠱，小有悔，无大咎。","六四：裕父之蠱，往見吝。","六五：幹父之蠱，用譽。","上九：不事王侯，高尚其事。"],"use":null,"xiang":"山下有風，《蠱》。君子以振民育德。","bh":{"gua":["大为亨通，利于渡大河；在甲日前三天、后三天筹划。","整顿烂摊子，正是时候。"],"lines":[["整治父亲留下的弊病，有这样的儿子，先父就没有过错；有危险但终吉。","接手旧问题，敢改就好。"],["整治母亲留下的弊病，不可过于坚持。","对亲近的人，改要温和。"],["整治父亲留下的弊病，小有悔恨，没有大过。","改革有小摩擦，但方向对。"],["纵容父亲留下的弊病，前往会难堪。","拖着不改，问题会变大。"],["整治父亲留下的弊病，获得赞誉。","改好了会被认可。"],["不侍奉王侯，把自己的事看得高尚。","不随波逐流，守住自己的志向。"]],"use":null}},"110000":{"n":19,"name":"臨","sym":"䷒","lo":"兌","hi":"坤","gua":"元亨，利貞。至于八月有凶。","lines":["初九：咸臨，貞吉。","九二：咸臨吉，无不利。","六三：甘臨，无攸利；既憂之，无咎。","六四：至臨，无咎。","六五：知臨，大君之宜，吉。","上六：敦臨吉，无咎。"],"use":null,"xiang":"澤上有地，《臨》。君子以教思无窮，容保民无疆。","bh":{"gua":["大为亨通，利于守正；到了八月会有凶。","势头正好，但好景有期限。"],"lines":[["以感化来临近治理，守正吉。","用真心影响别人。"],["以感化来临近，吉，无所不利。","以心换心，全都顺。"],["用甜言蜜语来治理，无所利；已经忧虑并改正，就没有过错。","别只说好听的，改了就行。"],["亲临其事，没有过错。","亲自到场处理。"],["以智慧来治理，是君主应有之道，吉。","用智慧而不是蛮力。"],["以敦厚来治理，吉而无过。","厚道到底。"]],"use":null}},"000011":{"n":20,"name":"觀","sym":"䷓","lo":"坤","hi":"巽","gua":"盥而不薦。有孚顒若。","lines":["初六：童觀，小人无咎，君子吝。","六二：闚觀，利女貞。","六三：觀我生進退。","六四：觀國之光，利用賓于王。","九五：觀我生，君子无咎。","上九：觀其生，君子无咎。"],"use":null,"xiang":"風行地上，《觀》。先王以省方觀民設教。","bh":{"gua":["祭祀时洗手之后还没献祭，心怀诚信，庄严肃穆。","先看清楚，再动手。"],"lines":[["像孩童一样观看，小人无过，君子难堪。","看得太浅，要看深一点。"],["从门缝里偷看，只适合女子守正。","视野太窄，打开门看。"],["观察自己的所作所为，来决定进退。","先审视自己再决定。"],["观看国家的光辉，适合做君王的宾客。","去见见世面，会有机会。"],["观察自己的所作所为，君子没有过错。","常自省就不会错。"],["观察他人的所作所为，君子没有过错。","看看别人，也照照自己。"]],"use":null}},"100101":{"n":21,"name":"噬嗑","sym":"䷔","lo":"震","hi":"離","gua":"亨。利用獄。","lines":["初九：屨校滅趾，无咎。","六二：噬膚滅鼻，无咎。","六三：噬腊肉遇毒，小吝，无咎。","九四：噬乾胏，得金矢。利艱貞、吉。","六五：噬乾肉，得黃金。貞厲无咎。","上九：何校滅耳，凶。"],"use":null,"xiang":"雷電《噬嗑》。先王以明罰勑法。","bh":{"gua":["亨通，利于断案用刑。","该咬的硬骨头就咬下去。"],"lines":[["脚上戴着刑具遮住了脚趾，没有过错。","小惩戒，及时止损。"],["咬软肉，连鼻子都陷了进去，没有过错。","用力过猛但没事。"],["咬干肉碰到了毒，小有难堪，没有过错。","遇到点麻烦，不严重。"],["咬带骨的干肉，得到金箭头；利于艰难中守正，吉。","啃硬骨头有回报。"],["咬干肉，得到黄金；守正有危险，没有过错。","有收获，但要谨慎。"],["扛着枷锁遮住了耳朵，凶。","不听劝会栽大跟头。"]],"use":null}},"101001":{"n":22,"name":"賁","sym":"䷕","lo":"離","hi":"艮","gua":"亨。小利有攸往。","lines":["初九：賁其趾，舍車而徒。","六二：賁其須。","九三：賁如濡如，永貞吉。","六四：賁如皤如，白馬翰如，匪寇，婚媾。","六五：賁于丘園，束帛戔戔，吝終吉。","上九：白賁，无咎。"],"use":null,"xiang":"山下有火，《賁》。君子以明庶政，无敢折獄。","bh":{"gua":["亨通，小有利于前往。","打扮一下，小事有助。"],"lines":[["装饰脚趾，舍弃车子而步行。","宁可朴素，也不贪便宜。"],["修饰胡须。","跟着对的人一起动。"],["装饰得华美润泽，长久守正吉。","美好要长久，靠坚持。"],["装饰得素白，白马奔驰；不是强盗，是来求婚的。","看着可疑，其实是好事。"],["装饰山丘园林，只有一束薄薄的丝帛，难堪但终吉。","礼轻情意重。"],["以白色为装饰，没有过错。","返璞归真最好。"]],"use":null}},"000001":{"n":23,"name":"剝","sym":"䷖","lo":"坤","hi":"艮","gua":"不利有攸往。","lines":["初六：剝床以足，蔑貞凶。","六二：剝床以辨，蔑貞凶。","六三：剝之无咎。","六四：剝床以膚，凶。","六五：貫魚以宮人寵，无不利。","上九：碩果不食，君子得輿，小人剝廬。"],"use":null,"xiang":"山附於地，《剝》。上以厚下安宅。","bh":{"gua":["不利于前往。","处在剥落期，少动为宜。"],"lines":[["床脚被剥蚀，轻蔑正道就凶。","根基出了问题，先修补。"],["床板被剥蚀，轻蔑正道就凶。","问题在扩大，赶紧处理。"],["身处剥落之中而能独善，没有过错。","身在乱局，也能独善其身。"],["剥蚀到了床上的皮肤，凶。","已经伤到切身，要警惕。"],["像串鱼一样率领众人，宠爱宫人，无所不利。","有序带人，转危为安。"],["硕大的果实没有被吃掉；君子得到车子，小人毁了房子。","保住根本，好日子会回来。"]],"use":null}},"100000":{"n":24,"name":"復","sym":"䷗","lo":"震","hi":"坤","gua":"亨。出入无疾。朋來无咎。反復其道，七日來復。利有攸往。","lines":["初九：不遠復，无祗悔，元吉。","六二：休復，吉。","六三：頻復，厲、无咎。","六四：中行獨復。","六五：敦復，无悔。","上六：迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。"],"use":null,"xiang":"雷在地中，《復》。先王以至日閉關，商旅不行，后不省方。","bh":{"gua":["亨通；出入无病，朋友来访无过；往复自有规律，七天回来，利于前往。","转机来了，重新开始。"],"lines":[["走得不远就回来，没有大的悔恨，大吉。","发现错了马上改。"],["美好的回归，吉。","向好人好事靠拢。"],["频繁地反复，有危险但没有过错。","反复也好过不改。"],["走在中途独自回归正道。","随众之中独自坚持对的路。"],["敦厚地回归，没有悔恨。","真诚回头，没有遗憾。"],["迷途不返，凶，有灾祸；用兵终会大败，连累国君，十年都不能出征。","执迷不悟，代价很大。"]],"use":null}},"100111":{"n":25,"name":"无妄","sym":"䷘","lo":"震","hi":"乾","gua":"元亨，利貞。其匪正有眚，不利有攸往。","lines":["初九：无妄，往吉。","六二：不耕穫；不菑畬；則利有攸往。","六三：无妄之災，或繫之牛，行人之得，邑人之災。","九四：可貞，无咎。","九五：无妄之疾，勿藥有喜。","上九：无妄，行有眚，无攸利。"],"use":null,"xiang":"天下雷行，物與《无妄》。先王以茂對時育萬物。","bh":{"gua":["大为亨通，利于守正；心术不正就有灾，不利于前往。","别有非分之想，顺其自然。"],"lines":[["不妄为，前往吉。","本分做事就顺。"],["不耕种就想收获、不开荒就想有熟田（能去掉这种念头），才利于前往。","别想着不劳而获。"],["意外之灾：有人拴着一头牛，被路人牵走了，村里人却遭了殃。","无辜受牵连，别太在意。"],["可以守正，没有过错。","守住就好。"],["意外之病，不用吃药自然会好。","别过度处理，会自愈。"],["不妄为，但此时行动会有灾祸，无所利。","现在不宜动。"]],"use":null}},"111001":{"n":26,"name":"大畜","sym":"䷙","lo":"乾","hi":"艮","gua":"利貞。不家食吉。利涉大川。","lines":["初九：有厲，利己。","九二：輿說輹。","九三：良馬逐，利艱貞，曰閑輿衛，利有攸往。","六四：童牛之牿，元吉。","六五：豶豕之牙，吉。","上九：何天之衢，亨。"],"use":null,"xiang":"天在山中，《大畜》。君子以多識前言往行以畜其德。","bh":{"gua":["利于守正，不在家吃饭吉，利于渡大河。","积累够了，出去闯。"],"lines":[["有危险，宜于停止。","先停一停。"],["车子脱了轴带。","暂时停下，不是坏事。"],["骏马追逐，艰难中守正有利；每天练习驾车防卫，利于前往。","准备充分再出发。"],["在小牛角上绑横木，大吉。","问题趁早约束。"],["阉过的猪，牙齿不再伤人，吉。","从根上解决问题。"],["走在四通八达的天路上，亨通。","前路大开。"]],"use":null}},"100001":{"n":27,"name":"頤","sym":"䷚","lo":"震","hi":"艮","gua":"貞吉。觀頤，自求口實。","lines":["初九：舍爾靈龜，觀我朵頤，凶。","六二：顛頤，拂經于丘，頤、征凶。","六三：拂頤貞、凶，十年勿用，无攸利。","六四：顛頤，吉。虎視眈眈，其欲逐逐，无咎。","六五：拂經，居貞、吉，不可涉大川。","上九：由頤，厲、吉。利涉大川。"],"use":null,"xiang":"山下有雷，《頤》。君子以慎言語、節飲食。","bh":{"gua":["守正吉；观察颐养之道，自己求取口中的食物。","自己的饭碗自己挣。"],"lines":[["放弃你的灵龟，看着我鼓腮吃东西，凶。","别羡慕别人，看好自己的。"],["颠倒向下求养，违背常理向高丘求养，前往凶。","找错了依靠。"],["违背颐养的正道，守正也凶，十年不能用，无所利。","方向错了，赶紧停。"],["颠倒向下求养，吉；像老虎一样专注注视，欲望接连不断，没有过错。","向下求助没关系，目标要专注。"],["违背常理，安居守正吉，不可渡大河。","守住，别冒大险。"],["众人靠他来养，有危险但吉，利于渡大河。","担子重，但能干成大事。"]],"use":null}},"011110":{"n":28,"name":"大過","sym":"䷛","lo":"巽","hi":"兌","gua":"棟橈，利有攸往，亨。","lines":["初六：藉用白茅，无咎。","九二：枯楊生稊，老夫得其女妻，无不利。","九三：棟橈，凶。","九四：棟隆、吉。有它、吝。","九五：枯楊生華，老婦得其士夫，无咎无譽。","上六：過涉滅頂，凶。无咎。"],"use":null,"xiang":"澤滅木，《大過》。君子以獨立不懼，遯世无悶。","bh":{"gua":["屋梁弯曲，利于前往，亨通。","压力太大，要主动调整。"],"lines":[["用白茅草垫着放祭品，没有过错。","多小心一点，总没错。"],["枯杨长出新芽，老人娶到年轻妻子，无所不利。","枯木逢春，意外之喜。"],["屋梁弯折，凶。","硬撑会塌，找人分担。"],["屋梁隆起，吉；有别的心思就难堪。","撑住了，别分心。"],["枯杨开了花，老妇嫁给年轻丈夫，没有过错也没有称赞。","好看，但不长久。"],["过河时水淹没头顶，凶，但无可责备。","过头了，但出于好意。"]],"use":null}},"010010":{"n":29,"name":"習坎","sym":"䷜","lo":"坎","hi":"坎","gua":"有孚，維心、亨。行有尚。","lines":["初六：習坎，入于坎窞，凶。","九二：坎有險，求小得。","六三：來之坎坎，險且枕，入于坎窞，勿用。","六四：樽酒、簋貳、用缶，納約自牖，終无咎。","九五：坎不盈，衹既平，无咎。","上六：係用徽纆，寘于叢棘，三歲不得，凶。"],"use":null,"xiang":"水洊至，《習坎》。君子以常德行、習教事。","bh":{"gua":["有诚信，维系于内心，亨通，行动会受崇尚。","困难重重，靠信念走过。"],"lines":[["重重险陷，落入坑洞深处，凶。","先别往里跳。"],["坑中有险，求取小有所得。","别贪多，小进就好。"],["来去都是险坑，险而且深，落入深坑，不要行动。","原地不动最安全。"],["一樽酒、两簋饭，用瓦器盛着，从窗口递送约定，终无过错。","简单真诚，能打通关节。"],["坑还没满，但已经快平了，没有过错。","快熬出头了。"],["被绳索捆绑，放在荆棘丛中，三年不得解脱，凶。","困局很深，要长期作战。"]],"use":null}},"101101":{"n":30,"name":"離","sym":"䷝","lo":"離","hi":"離","gua":"利貞。亨。畜牝牛吉。","lines":["初九：履錯然敬之，无咎。","六二：黃離，元吉。","九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。","九四：突如、其來如，焚如，死如，棄如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，獲匪其醜，无咎。"],"use":null,"xiang":"明兩、作《離》。大人以繼明照于四方。","bh":{"gua":["利于守正，亨通；畜养母牛吉。","依附光明，柔顺得吉。"],"lines":[["脚步错杂，恭敬对待就没有过错。","开头乱，认真就好。"],["黄色的光明，大吉。","守中正之道，最吉。"],["夕阳西下的光，不敲着瓦缶唱歌，就会有老迈的嗟叹，凶。","接受变化，乐观面对。"],["突然而来，像火烧，像死亡，像被抛弃。","来得猛的，去得也快。"],["泪流滂沱，忧伤叹息，吉。","能难过，也就能好起来。"],["君王出征，有嘉奖，斩杀首恶，俘获的不是其同伙，没有过错。","只处理关键，别牵连太广。"]],"use":null}},"001110":{"n":31,"name":"咸","sym":"䷞","lo":"艮","hi":"兌","gua":"亨。利貞。取女吉。","lines":["初六：咸其拇。","六二：咸其腓，凶。居吉。","九三：咸其股，執其隨，往吝。","九四：貞吉。悔亡。憧憧往來，朋從爾思。","九五：咸其脢，无悔。","上六：咸其輔頰舌。"],"use":null,"xiang":"山上有澤，《咸》。君子以虛受人。","bh":{"gua":["亨通，利于守正，娶妻吉。","心意相通，感情顺利。"],"lines":[["感应在脚拇指上。","心动了，但还没行动。"],["感应在小腿上，凶；安居则吉。","别急躁，等一等。"],["感应在大腿上，一味跟随别人，前往难堪。","别盲目跟风。"],["守正吉，悔恨消失；心神不定、来来往往，朋友顺从你的想法。","真心比算计有用。"],["感应在背脊的肉上，没有悔恨。","感受不深，但没遗憾。"],["感应在嘴巴、脸颊和舌头上。","光说不做。"]],"use":null}},"011100":{"n":32,"name":"恆","sym":"䷟","lo":"巽","hi":"震","gua":"亨。无咎。利貞。利有攸往。","lines":["初六：浚恆，貞凶，无攸利。","九二：悔亡。","九三：不恆其德，或承之羞，貞吝。","九四：田无禽。","六五：恆其德、貞，婦人吉，夫子凶。","上六：振恆，凶。"],"use":null,"xiang":"雷風《恆》。君子以立不易方。","bh":{"gua":["亨通，没有过错，利于守正，利于前往。","持之以恒，就会成。"],"lines":[["一开始就求深入持久，守正也凶，无所利。","别急于求成。"],["悔恨消失。","坚持对了，没遗憾。"],["德行不能持久，可能蒙受羞辱，守正也难堪。","三心二意会丢面子。"],["打猎没有猎物。","方向不对，白忙一场。"],["恒守其德，对妇人吉，对丈夫凶。","该坚持什么，要看场合。"],["动摇不定，凶。","反复折腾最伤。"]],"use":null}},"001111":{"n":33,"name":"遯","sym":"䷠","lo":"艮","hi":"乾","gua":"亨。小利貞。","lines":["初六：遯尾、厲，勿用有攸往。","六二：執之用黃牛之革，莫之勝、說。","九三：係遯，有疾厲，畜臣妾吉。","九四：好遯，君子吉，小人否。","九五：嘉遯，貞吉。","上九：肥遯，无不利。"],"use":null,"xiang":"天下有山，《遯》。君子以遠小人，不惡而嚴。","bh":{"gua":["亨通，小事利于守正。","该退就退，退是为了进。"],"lines":[["退避落在最后，有危险，不要有所前往。","走晚了，先别动。"],["用黄牛皮绳绑住，没有人能解开。","认定的事就坚持住。"],["退避时被牵累，有病有危险；畜养仆妾则吉。","有牵挂走不掉，先照顾好身边小事。"],["心怀好意地退避，君子吉，小人不然。","体面地退出。"],["美好的退避，守正吉。","时机正好，漂亮退场。"],["从容远退，无所不利。","放下了，一身轻松。"]],"use":null}},"111100":{"n":34,"name":"大壯","sym":"䷡","lo":"乾","hi":"震","gua":"利貞。","lines":["初九：壯于趾，征凶有孚。","九二：貞吉。","九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","九四：貞吉，悔亡。藩決不羸，壯于大輿之輹。","六五：喪羊于易，无悔。","上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。"],"use":null,"xiang":"雷在天上，《大壯》。君子以非禮弗履。","bh":{"gua":["利于守正。","势头强，更要守规矩。"],"lines":[["强壮在脚趾，前往凶，这是确定的。","起步别太猛。"],["守正吉。","稳住就好。"],["小人用强，君子不用；守正也有危险，公羊顶篱笆，角被缠住。","硬顶会被困住。"],["守正吉，悔恨消失；篱笆开了，角不再被缠，强壮在大车的轴上。","障碍打开，可以前进。"],["在场界上丢了羊，没有悔恨。","失去一点，不必心疼。"],["公羊顶篱笆，不能退也不能进，无所利；艰难中坚持则吉。","卡住了，熬过去就好。"]],"use":null}},"000101":{"n":35,"name":"晉","sym":"䷢","lo":"坤","hi":"離","gua":"康侯用錫馬蕃庶，晝日三接。","lines":["初六：晉如摧如，貞吉。罔孚，裕无咎。","六二：晉如，愁如，貞吉。受茲介福于其王母。","六三：眾允，悔亡。","九四：晉如鼫鼠，貞厲。","六五：悔亡，失得勿恤。往吉，无不利。","上九：晉其角，維用伐邑，厲吉，无咎，貞吝。"],"use":null,"xiang":"明出地上，《晉》。君子以自昭明德。","bh":{"gua":["康侯用天子赏赐的马繁育众多，一天之内三次被接见。","上升期，受到重视。"],"lines":[["前进受挫，守正吉；还没被信任，宽裕以待就没有过错。","被质疑别急，慢慢证明。"],["前进又忧愁，守正吉；从祖母那里得到大福。","会有长辈贵人相助。"],["众人信服，悔恨消失。","大家支持你。"],["像大老鼠一样前进，守正也有危险。","贪心又胆小，要改。"],["悔恨消失，得失不必忧虑，前往吉，无所不利。","别计较得失，往前走。"],["前进到了角尖，只能用来征伐城邑；有危险但吉，没有过错，守正也难堪。","到顶了，只适合处理内部。"]],"use":null}},"101000":{"n":36,"name":"明夷","sym":"䷣","lo":"離","hi":"坤","gua":"利艱貞。","lines":["初九：明夷于飛，垂其翼。君子于行，三日不食。有攸往，主人有言。","六二：明夷、夷于左股，用拯馬、壯吉。","九三：明夷于南狩，得其大首，不可疾貞。","六四：入于左腹，獲明夷之心于出門庭。","六五：箕子之明夷，利貞。","上六：不明、晦。初登于天，後入于地。"],"use":null,"xiang":"明入地中，《明夷》。君子以莅眾用晦而明。","bh":{"gua":["利于艰难中守正。","大环境不好，韬光养晦。"],"lines":[["光明受伤时飞走，垂下翅膀；君子出行三天不吃饭，前往时主人有闲话。","赶紧离开，忍一时之苦。"],["光明受伤，伤了左腿，借壮马来救助，吉。","受点伤，有人拉你一把。"],["光明受伤时南下狩猎，捕获大首领，不可急于求正。","抓住关键，但别操之过急。"],["进入左腹，了解到昏暗的内情，出门离开。","看清真相就撤。"],["像箕子那样自藏光明，利于守正。","装装糊涂，保住自己。"],["不光明而昏暗，起初登上了天，后来落入地下。","高开低走，要警惕。"]],"use":null}},"101011":{"n":37,"name":"家人","sym":"䷤","lo":"離","hi":"巽","gua":"利女貞。","lines":["初九：閑有家，悔亡。","六二：无攸遂，在中饋，貞吉。","九三：家人嗃嗃，悔厲，吉；婦子嘻嘻，終吝。","六四：富家，大吉。","九五：王假有家，勿恤，吉。","上九：有孚威如，終吉。"],"use":null,"xiang":"風自火出，《家人》。君子以言有物而行有恆。","bh":{"gua":["利于女子守正。","先把家里理顺。"],"lines":[["家中先立规矩，悔恨消失。","一开始就立规矩。"],["不擅自做主，在家中主持饮食，守正吉。","做好本分最重要。"],["家人严厉，虽有悔有危仍吉；妇孺嬉笑，终会难堪。","宁严勿松。"],["使家富裕，大吉。","持家有道，财运好。"],["君王以德感化家人，不必忧虑，吉。","以身作则，家和万事兴。"],["有诚信又有威严，终归吉。","严而有信，终有好结果。"]],"use":null}},"110101":{"n":38,"name":"睽","sym":"䷥","lo":"兌","hi":"離","gua":"小事吉。","lines":["初九：悔亡。喪馬，勿逐自復。見惡人无咎。","九二：遇主于巷，无咎。","六三：見輿曳，其牛掣，其人天且劓，无初有終。","九四：睽孤，遇元夫，交孚，厲无咎。","六五：悔亡。厥宗噬膚，往何咎？","上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇，婚媾。往遇雨，則吉。"],"use":null,"xiang":"上火下澤，《睽》。君子以同而異。","bh":{"gua":["小事吉。","意见不合，小事还能办。"],"lines":[["悔恨消失；丢了马不用追，自己会回来；见到恶人也没有过错。","该回来的自会回来。"],["在小巷里遇到主人，没有过错。","非正式场合也能解决问题。"],["看到车被拖住，牛被牵制，人受了刺额割鼻之刑；开头不好，结局却好。","开局很糟，但能扭转。"],["乖离孤独，遇到大丈夫，以诚相交，有危险但没有过错。","孤单时会遇到知己。"],["悔恨消失，宗亲像咬软肉一样容易亲合，前往有什么过错。","找自己人，一拍即合。"],["乖离孤独，看见猪满身泥，车上载满了鬼；先拉弓后放下，不是强盗是来求婚的；前往遇雨则吉。","多疑看什么都是鬼，放下猜忌就好。"]],"use":null}},"001010":{"n":39,"name":"蹇","sym":"䷦","lo":"艮","hi":"坎","gua":"利西南，不利東北。利見大人。貞吉。","lines":["初六：往蹇來譽。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇來反。","六四：往蹇來連。","九五：大蹇，朋來。","上六：往蹇，來碩，吉，利見大人。"],"use":null,"xiang":"山上有水，《蹇》。君子以反身修德。","bh":{"gua":["利于西南，不利于东北；利见大人，守正吉。","路难走，找贵人。"],"lines":[["前往艰难，回来有赞誉。","这时退回来更好。"],["王臣历尽艰难，不是为了自己。","为大局吃苦，问心无愧。"],["前往艰难，回来返归本位。","回头是对的。"],["前往艰难，回来联合众人。","独自难办，找人一起。"],["大难之中朋友来助。","最难的时候会有人帮。"],["前往艰难，回来大有收获，吉，利见大人。","回头找贵人，大有收获。"]],"use":null}},"010100":{"n":40,"name":"解","sym":"䷧","lo":"坎","hi":"震","gua":"利西南。无所往，其來復吉。有攸往，夙吉。","lines":["初六：无咎。","九二：田獲三狐，得黃矢，貞吉。","六三：負且乘，致寇至，貞吝。","九四：解而拇，朋至斯孚。","六五：君子維有解，吉，有孚于小人。","上六：公用射隼于高墉之上，獲之，无不利。"],"use":null,"xiang":"雷雨作，《解》。君子以赦過宥罪。","bh":{"gua":["利于西南；无处可去就回来，吉；有所前往，早去吉。","困难解除，趁早行动。"],"lines":[["没有过错。","问题已解，安心。"],["打猎获得三只狐狸，得到黄铜箭头，守正吉。","清除隐患，还有收获。"],["背着东西又坐车，招来盗寇，守正也难堪。","身份和行为不配，惹麻烦。"],["解开你的大脚趾，朋友来了，彼此信任。","甩开拖累，真朋友会来。"],["君子能够解脱，吉，小人也会信服。","自己想通了，别人也服。"],["王公在高墙上射鹰隼，射中了，无所不利。","时机到了，一击即中。"]],"use":null}},"110001":{"n":41,"name":"損","sym":"䷨","lo":"兌","hi":"艮","gua":"有孚，元吉，无咎可貞。利有攸往。曷之用，二簋可用享。","lines":["初九：已事遄往，无咎。酌損之。","九二：利貞。征凶，弗損，益之。","六三：三人行則損一人，一人行則得其友。","六四：損其疾，使遄有喜，无咎。","六五：或益之十朋之龜，弗克違，元吉。","上九：弗損，益之，无咎，貞吉，利有攸往，得臣无家。"],"use":null,"xiang":"山下有澤，《損》。君子以懲忿窒欲。","bh":{"gua":["有诚信，大吉无过，可以守正，利于前往；用什么祭祀？两簋就够了。","减一点，反而更好。"],"lines":[["办完事赶快前去，没有过错，要斟酌减损。","帮人要适度。"],["利于守正，前往凶；不减损自己就能增益对方。","守住自己，也是帮忙。"],["三人同行会少一人，一人独行会得到朋友。","人多心杂，一对一更好。"],["减轻疾病，让它快点好，有喜，没有过错。","改掉毛病，马上见效。"],["有人送来价值十朋的宝龟，推辞不掉，大吉。","好处送上门，收下吧。"],["不减损而增益，没有过错，守正吉，利于前往，得到忠臣而不限于一家。","双赢局面，大胆去。"]],"use":null}},"100011":{"n":42,"name":"益","sym":"䷩","lo":"震","hi":"巽","gua":"利有攸往。利涉大川。","lines":["初九：利用為大作，元吉，无咎。","六二：或益之，十朋之龜弗克違。永貞吉。王用享于帝，吉。","六三：益之，用凶事无咎。有孚，中行。告公用圭。","六四：中行告公，從，利用為依遷國。","九五：有孚惠心，勿問，元吉。有孚惠我德。","上九：莫益之，或擊之，立心勿恆，凶。"],"use":null,"xiang":"風雷《益》。君子以見善則遷，有過則改。","bh":{"gua":["利于前往，利于渡大河。","增益期，适合做大事。"],"lines":[["利于做大事，大吉，没有过错。","有资源就干一票大的。"],["有人送来价值十朋的宝龟推辞不掉，长久守正吉；君王祭祀上帝，吉。","运气好，要让它长久。"],["在凶事中得到增益，没有过错；有诚信，行中道，执圭告知王公。","危机中也有收获，坦诚上报。"],["行中道告知王公，被采纳，利于依托大局迁国。","提建议会被采纳，可以大调整。"],["有诚信惠民之心，不必问，大吉；别人也会感念我的德。","真心待人，不用算计。"],["没人增益他，反而有人攻击他，立心不能持久，凶。","只顾自己会被围攻。"]],"use":null}},"111110":{"n":43,"name":"夬","sym":"䷪","lo":"乾","hi":"兌","gua":"揚于王庭，孚號有厲，告自邑。不利即戎，利有攸往。","lines":["初九：壯于前趾，往不勝，為咎。","九二：惕號，莫夜有戎，勿恤。","九三：壯于頄，有凶。君子夬夬，獨行遇雨、若濡，有慍无咎。","九四：臀无膚，其行次且。牽羊悔亡。聞言不信。","九五：莧陸夬夬，中行无咎。","上六：无號，終有凶。"],"use":null,"xiang":"澤上於天，《夬》。君子以施祿及下，居德則忌。","bh":{"gua":["在朝廷上宣布罪状，诚信呼号有危险；告诫自己的城邑，不宜动武，利于前往。","果断解决，但别动粗。"],"lines":[["强壮在脚趾前端，前往不能取胜，成了过错。","别冲在最前面。"],["警惕呼号，夜里有兵来，不必担忧。","有防备就不怕。"],["强壮在颧骨上，有凶；君子果决，独行遇雨被淋湿，有人不满，但没有过错。","被误解也要坚持对的事。"],["臀部没有皮肤，走路艰难；牵着羊走悔恨就会消失，可惜听了话也不信。","听得进劝，就能走出困境。"],["像拔除苋陆草一样果决，行中道没有过错。","果断除掉小问题。"],["没有呼号，最终有凶。","别心存侥幸。"]],"use":null}},"011111":{"n":44,"name":"姤","sym":"䷫","lo":"巽","hi":"乾","gua":"女壯，勿用取女。","lines":["初六：繫于金柅，貞吉。有攸往，見凶，羸豕孚蹢躅。","九二：包有魚，无咎，不利賓。","九三：臀无膚，其行次且，厲，无大咎。","九四：包无魚，起凶。","九五：以杞包瓜，含章，有隕自天。","上九：姤其角，吝，无咎。"],"use":null,"xiang":"天下有風，《姤》。后以施命誥四方。","bh":{"gua":["女子太强盛，不要娶她。","突然的相遇，别轻易托付。"],"lines":[["系在金属的刹车上，守正吉；有所前往就会见凶，瘦猪急躁不安。","刹住车，别冲动。"],["厨房里有鱼，没有过错，不利于宾客。","好东西自己留着处理。"],["臀部没有皮肤，走路艰难，有危险，但没有大过错。","进退两难，但问题不大。"],["厨房里没有鱼，起而争执就凶。","失去人心，先别争。"],["用杞树叶包着瓜，含藏美德，有东西从天而降。","低调有内涵，好事会来。"],["相遇在角上，难堪但没有过错。","太硬了不好相处。"]],"use":null}},"000110":{"n":45,"name":"萃","sym":"䷬","lo":"坤","hi":"兌","gua":"亨，王假有廟。利見大人。亨，利貞，用大牲吉。利有攸往。","lines":["初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。","六二：引吉，无咎，孚乃利用禴。","六三：萃如嗟如，无攸利，往无咎，小吝。","九四：大吉无咎。","九五：萃有位，无咎。匪孚，元、永貞悔亡。","上六：齎咨涕洟，无咎。"],"use":null,"xiang":"澤上於地，《萃》。君子以除戎器，戒不虞。","bh":{"gua":["亨通，君王到宗庙祭祀；利见大人，亨通利于守正；用大牲祭祀吉，利于前往。","人气聚集，适合办大事。"],"lines":[["诚信不能坚持到底，时乱时聚；如果呼号，一握手就破涕为笑，不必担忧，前往没有过错。","一时混乱，开口沟通就好。"],["被人引荐吉，没有过错；有诚信，简单的祭祀也合宜。","有人推荐你，心诚就好。"],["想聚合却叹息，无所利；前往没有过错，小有难堪。","融不进去，就主动一点。"],["大吉，没有过错。","大胆聚人。"],["聚合时居于尊位，没有过错；还没取信于人，就长久守正，悔恨会消失。","有了位置，还要赢得信任。"],["叹息流泪，没有过错。","哭一场就好了。"]],"use":null}},"011000":{"n":46,"name":"升","sym":"䷭","lo":"巽","hi":"坤","gua":"元亨。用見大人，勿恤。南征吉。","lines":["初六：允升，大吉。","九二：孚乃利用禴，无咎。","九三：升虛邑。","六四：王用亨于岐山，吉，无咎。","六五：貞吉，升階。","上六：冥升，利于不息之貞。"],"use":null,"xiang":"地中生木，升。君子以順德，積小以高大。","bh":{"gua":["大为亨通，去见大人，不必担忧，向南出征吉。","步步高升，放心往前。"],"lines":[["得到信任而上升，大吉。","被认可，好开始。"],["有诚信，简单的祭祀也合宜，没有过错。","心诚最重要。"],["升进到空城里。","畅通无阻。"],["君王在岐山祭祀，吉，没有过错。","顺势而为，大吉。"],["守正吉，登上台阶。","一步一个台阶。"],["昏暗中还在上升，利于不停息地守正。","别只顾往上，稳住根本。"]],"use":null}},"010110":{"n":47,"name":"困","sym":"䷮","lo":"坎","hi":"兌","gua":"亨。貞大人吉，无咎。有言不信。","lines":["初六：臀困于株木，入于幽谷，三歲不覿。","九二：困于酒食，朱紱方來。利用享祀。征凶无咎。","六三：困于石，據于蒺蔾，入于其宮，不見其妻，凶。","九四：來徐徐，困于金車，吝，有終。","九五：劓刖，困于赤紱，乃徐有說，利用祭祀。","上六：困于葛藟，于臲卼，曰動悔有悔，征吉。"],"use":null,"xiang":"澤无水，困。君子以致命遂志。","bh":{"gua":["亨通；守正的大人吉，没有过错；说话没人信。","困境中少说多做。"],"lines":[["臀部困在树桩上，进入幽暗的山谷，三年不见人。","低谷期，先忍着。"],["困于酒食，朱红的官服刚刚送来；利于祭祀，前往凶，没有过错。","机会来了，但别急着动。"],["困在石头下，靠在蒺藜上，回到家里，见不到妻子，凶。","处处碰壁，换个方向。"],["来得很慢，被困在金车里，难堪但有好结局。","慢一点，但会到。"],["被割鼻断脚，困于穿红服的贵人，慢慢会解脱，利于祭祀。","被上面压着，慢慢会好。"],["被葛藤缠住，处境不安，说\"一动就会后悔\"；能够悔悟，前往吉。","想太多动不了，其实该动了。"]],"use":null}},"011010":{"n":48,"name":"井","sym":"䷯","lo":"巽","hi":"坎","gua":"改邑不改井，无喪无得。往來井井。汔至，亦未繘井，羸其瓶，凶。","lines":["初六：井泥不食。舊井无禽。","九二：井谷射鮒，甕敝漏。","九三：井渫不食，為我心惻。可用汲，王明，並受其福。","六四：井甃，无咎。","九五：井洌寒泉，食。","上六：井收勿幕，有孚元吉。"],"use":null,"xiang":"木上有水，《井》。君子以勞民勸相。","bh":{"gua":["城邑可以改换，井不能改换，不失不得，往来的人都从井里取水；快到井口，绳子不够长，打破了瓶，凶。","守住根本，功亏一篑最可惜。"],"lines":[["井底都是泥不能喝，旧井连鸟都不来。","先清理自己，别被淘汰。"],["井底的小鱼被射，水瓮破了漏水。","能力用错了地方。"],["井已清洗干净却没人喝，让我心里难过；可以汲取，君王英明，大家都受福。","有才能暂时没人用，别灰心。"],["修砌井壁，没有过错。","修整自己，打好基础。"],["井水清冽，清凉的泉水可以饮用。","你的价值被认可了。"],["井口汲水不要盖上，有诚信，大吉。","大方分享，成就更大。"]],"use":null}},"101110":{"n":49,"name":"革","sym":"䷰","lo":"離","hi":"兌","gua":"巳日乃孚。元亨，利貞，悔亡。","lines":["初九：鞏用黃牛之革。","六二：巳日乃革之，征吉，无咎。","九三：征凶。貞厲。革言三就有孚。","九四：悔亡。有孚改命吉。","九五：大人虎變，未占有孚。","上六：君子豹變，小人革面，征凶，居貞吉。"],"use":null,"xiang":"澤中有火，《革》。君子以治厤明時。","bh":{"gua":["到了巳日才能取信于人，大为亨通，利于守正，悔恨消失。","变革时机成熟，改！"],"lines":[["用黄牛皮牢牢捆住。","时机未到，先别变。"],["到了巳日才变革，前往吉，没有过错。","时间到了，可以改。"],["前往凶，守正有危险；变革的主张经过三次讨论才能取信。","多商量几次再动。"],["悔恨消失，有诚信，改变天命，吉。","大改动，会成功。"],["大人像老虎换毛一样变革，不用占卜就有人信服。","大胆改，大家会服。"],["君子像豹子换毛一样变化，小人改变表面；前往凶，安居守正吉。","改到这里就够了，稳住。"]],"use":null}},"011101":{"n":50,"name":"鼎","sym":"䷱","lo":"巽","hi":"離","gua":"元吉，亨。","lines":["初六：鼎顛趾，利出否。得妾以其子，无咎。","九二：鼎有實，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨，虧悔，終吉。","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黃耳金鉉，利貞。","上九：鼎玉鉉，大吉，无不利。"],"use":null,"xiang":"木上有火，《鼎》。君子以正位凝命。","bh":{"gua":["大吉，亨通。","新局面，稳固而有成。"],"lines":[["鼎倒过来脚朝上，利于倒出污物；娶妾而得到儿子，没有过错。","倒掉旧东西，反而有收获。"],["鼎里有食物，我的对手有病，不能接近我，吉。","有实力，小人近不了身。"],["鼎耳变了，行动受阻，美味的野鸡汤吃不上；将要下雨，悔恨减少，终归吉。","暂时卡住，会通的。"],["鼎足折断，打翻了王公的美食，弄得满身狼藉，凶。","能力不够别硬扛。"],["鼎配着黄色的耳、金色的杠，利于守正。","有好搭档，稳当。"],["鼎配着玉杠，大吉，无所不利。","刚柔兼济，最完美。"]],"use":null}},"100100":{"n":51,"name":"震","sym":"䷲","lo":"震","hi":"震","gua":"亨。震來虩虩，笑言啞啞，震驚百里，不喪匕鬯。","lines":["初九：「震來虩虩」，後「笑言啞啞」，吉。","六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。","六三：震蘇蘇，震行无眚。","九四：震遂泥。","六五：震往來厲，意无喪有事。","上六：震索索，視矍矍，征凶。震不于其躬、于其鄰、无咎。婚媾有言。"],"use":null,"xiang":"洊雷、《震》。君子以恐懼脩省。","bh":{"gua":["亨通；雷来时惊恐，然后谈笑自若；雷声震惊百里，主祭的人手中勺和酒都没掉落。","受惊不乱，就能掌握局面。"],"lines":[["雷来时惊恐，然后谈笑自若，吉。","先怕后笑，是好事。"],["雷来有危险，估计要丢钱财，登上高陵，不用追，七天后失而复得。","损失会回来，别追。"],["雷声令人惶恐不安，因震而行动就没有灾祸。","被惊醒了，赶紧行动。"],["雷坠落在泥里。","想发力却陷住了。"],["雷声来往都有危险，但估计没有损失，还能做事。","风波不断，守住就行。"],["雷声使人畏缩，目光惶恐，前往凶；雷没打到自己而打到邻居，没有过错；婚事会有闲话。","看邻居出事，引以为戒。"]],"use":null}},"001001":{"n":52,"name":"艮","sym":"䷳","lo":"艮","hi":"艮","gua":"其背，不獲其身，行其庭，不見其人，无咎。","lines":["初六：艮其趾，无咎。利永貞。","六二：艮其腓，不拯其隨，其心不快。","九三：艮其限，列其夤，厲薰心。","六四：艮其身，无咎。","六五：艮其輔，言有序，悔亡。","上九：敦艮，吉。"],"use":null,"xiang":"兼山，《艮》。君子以思不出其位。","bh":{"gua":["止在背后，看不到自己的身体；走在庭院里，看不到人，没有过错。","停下来，静一静。"],"lines":[["止住脚趾，没有过错，利于长久守正。","一开始就停住，最好。"],["止住小腿，不能救助所跟随的人，心里不痛快。","想帮帮不上，别自责。"],["止住腰部，脊背的肉被撕裂，危险像烟火熏心。","硬压着会伤，要疏导。"],["止住身体，没有过错。","管好自己。"],["止住口舌，说话有条理，悔恨消失。","少说，说对。"],["敦厚地止住，吉。","稳重到底，吉。"]],"use":null}},"001011":{"n":53,"name":"漸","sym":"䷴","lo":"艮","hi":"巽","gua":"女歸吉。利貞。","lines":["初六：鴻漸于干。小子厲有言，无咎。","六二：鴻漸于磐，飲食衎衎，吉。","九三：鴻漸于陸。夫征不復，婦孕不育，凶。利禦寇。","六四：鴻漸于木，或得其桷，无咎。","九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。","上九：鴻漸于陸，其羽可用為儀，吉。"],"use":null,"xiang":"山上有木，《漸》。君子以居賢德善俗。","bh":{"gua":["女子出嫁吉，利于守正。","循序渐进，好事会成。"],"lines":[["大雁渐渐飞到水边；小孩有危险，有闲话，没有过错。","起步有小麻烦，没关系。"],["大雁渐渐飞到磐石上，饮食和乐，吉。","安稳下来，享受当下。"],["大雁飞到陆地上，丈夫出征不回，妻子怀孕不育，凶；利于防御。","别冒进，先守好。"],["大雁飞到树上，或许能找到平直的树枝，没有过错。","找到落脚点就好。"],["大雁飞到山陵，妻子三年不孕，最终没有什么能阻挡，吉。","等得久，但会成。"],["大雁飞到高处，它的羽毛可以用作仪饰，吉。","成为别人的榜样。"]],"use":null}},"110100":{"n":54,"name":"歸妹","sym":"䷵","lo":"兌","hi":"震","gua":"征凶，无攸利。","lines":["初九：歸妹以娣。跛能履，征吉。","九二：眇能視，利幽人之貞。","六三：歸妹以須，反歸以娣。","九四：歸妹愆期，遲歸有時。","六五：帝乙歸妹，其君之袂不如其娣之袂良。月幾望、吉。","上六：女承筐，无實，士刲羊，无血，无攸利。"],"use":null,"xiang":"澤上有雷，《歸妹》。君子以永終知敝。","bh":{"gua":["前往凶，无所利。","名不正言不顺，别急。"],"lines":[["嫁妹时以妹妹陪嫁，跛了脚也能走路，前往吉。","做配角也能成事。"],["瞎了一只眼也能看，利于安静自守的人守正。","条件不完美，守住就好。"],["嫁妹时想以正室身份出嫁，结果返回以陪嫁的身份出嫁。","期望太高，只能降格。"],["嫁期延误，晚嫁自有时机。","晚一点，没关系。"],["帝乙嫁妹，她的衣袖不如陪嫁者的华美；月近圆，吉。","重内在，不重外表。"],["女子捧着筐却没有东西，男子杀羊却不见血，无所利。","虚有其表，没有实质。"]],"use":null}},"101100":{"n":55,"name":"豐","sym":"䷶","lo":"離","hi":"震","gua":"亨，王假之。勿憂，宜日中。","lines":["初九：遇其配主，雖旬无咎，往有尚。","六二：豐其蔀，日中見斗。往得疑疾，有孚，發若吉。","九三：豐其沛，日中見沬，折其右肱，无咎。","九四：豐其蔀，日中見斗，遇其夷主，吉。","六五：來章，有慶譽，吉。","上六：豐其屋，蔀其家，闚其戶，闃其无人，三歲不覿，凶。"],"use":null,"xiang":"雷電皆至，《豐》。君子以折獄致刑。","bh":{"gua":["亨通，君王到来，不必忧虑，宜在正午。","盛大之时，趁热打铁。"],"lines":[["遇到匹配的主人，虽然彼此相等也没有过错，前往受尊崇。","遇到对的伙伴。"],["遮蔽太厚，正午看见北斗；前往会被猜疑，以诚信感发则吉。","被误解，用真诚化解。"],["遮蔽的帘幕太大，正午看见小星，折断了右臂，没有过错。","暂时施展不开。"],["遮蔽太厚，正午看见北斗，遇到同等的主人，吉。","在暗处找到同道。"],["招来美好的人才，有喜庆有赞誉，吉。","引进人才，大好事。"],["房屋高大，家里遮得严严实实，从门缝往里看，寂静无人，三年不见，凶。","自我封闭，孤立无援。"]],"use":null}},"001101":{"n":56,"name":"旅","sym":"䷷","lo":"艮","hi":"離","gua":"小亨。旅貞吉。","lines":["初六：旅瑣瑣斯，其所取災。","六二：旅即次，懷其資，得童僕貞。","九三：旅焚其次，喪其童僕貞，厲。","九四：旅于處，得其資斧，我心不快。","六五：射雉一矢亡，終以譽命。","上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。"],"use":null,"xiang":"山上有火，《旅》。君子以明慎用刑而不留獄。","bh":{"gua":["小有亨通，旅途中守正吉。","在外做客，低调安稳。"],"lines":[["旅途中猥琐计较，自取其灾。","在外别斤斤计较。"],["旅途住进客栈，带着钱财，得到童仆的忠心。","有落脚处，有人帮。"],["旅途中客栈失火，失去童仆的忠心，守正有危险。","傲慢会失去帮助。"],["旅途中有处安身，得到钱财和斧头，但我心里不痛快。","有所得，但不踏实。"],["射野鸡丢了一支箭，最终得到美誉和爵命。","小投入换来好名声。"],["鸟巢被烧，旅人先笑后哭；在场界丢了牛，凶。","得意忘形，会失去重要的东西。"]],"use":null}},"011011":{"n":57,"name":"巽","sym":"䷸","lo":"巽","hi":"巽","gua":"小亨。利有攸往。利見大人。","lines":["初六：進退。利武人之貞。","九二：巽在床下，用史巫、紛若吉、无咎。","九三：頻巽，吝。","六四：悔亡，田獲三品。","九五：貞吉，悔亡，无不利，无初有終。先庚三日，後庚三日，吉。","上九：巽在床下，喪其資斧，貞凶。"],"use":null,"xiang":"隨風，《巽》。君子以申命行事。","bh":{"gua":["小有亨通，利于前往，利见大人。","顺势而入，柔中取胜。"],"lines":[["进退不定，利于武人坚守正道。","拿定主意，果断点。"],["恭顺地伏在床下，请史官巫师多次祈祷，吉，没有过错。","放低姿态，多沟通。"],["一再地恭顺，难堪。","一味顺从会失去尊重。"],["悔恨消失，打猎获得三种猎物。","付出有回报。"],["守正吉，悔恨消失，无所不利；开始不好结果好；在庚日前三天、后三天筹划，吉。","改变之前准备好，结局会好。"],["恭顺地伏在床下，丢了钱财和斧头，守正也凶。","太卑微会失去一切。"]],"use":null}},"110110":{"n":58,"name":"兌","sym":"䷹","lo":"兌","hi":"兌","gua":"亨。利貞。","lines":["初九：和兌，吉。","九二：孚兌，吉，悔亡。","六三：來兌，凶。","九四：商兌未寧，介疾有喜。","九五：孚于剝，有厲。","上六：引兌。"],"use":null,"xiang":"麗澤，《兌》。君子以朋友講習。","bh":{"gua":["亨通，利于守正。","愉快交流，事情顺。"],"lines":[["和悦待人，吉。","真诚友好就对了。"],["诚信而喜悦，吉，悔恨消失。","发自内心的快乐。"],["刻意讨好求悦，凶。","别为讨好而讨好。"],["权衡喜悦之事还没安定，隔绝小疾就会有喜。","远离坏影响，好事会来。"],["信任剥蚀正道的小人，有危险。","别被甜言蜜语骗了。"],["引诱别人一起取乐。","别被人带偏。"]],"use":null}},"010011":{"n":59,"name":"渙","sym":"䷺","lo":"坎","hi":"巽","gua":"亨。王假有廟。利涉大川，利貞。","lines":["初六：用拯馬壯，吉。","九二：渙奔其机，悔亡。","六三：渙其躬，无悔。","六四：渙其群，元吉。渙有丘，匪夷所思。","九五：渙汗其大號，渙王居，无咎。","上九：渙其血，去逖出，无咎。"],"use":null,"xiang":"風行水上，《渙》。先王以享于帝，立廟。","bh":{"gua":["亨通，君王到宗庙，利于渡大河，利于守正。","化解隔阂，重新凝聚。"],"lines":[["借用强壮的马来救助，吉。","借力一把就能脱困。"],["离散时奔向可依靠的几案，悔恨消失。","找到依靠就安心了。"],["涣散自身的私心，没有悔恨。","放下小我。"],["散开小团体，大吉；散而又聚成山丘，不是常人所能想到的。","打破小圈子，格局更大。"],["像出汗一样发布号令，散财于民，君王居所安稳，没有过错。","大方出手，稳住人心。"],["散去伤害，远远离开，没有过错。","远离是非。"]],"use":null}},"110010":{"n":60,"name":"節","sym":"䷻","lo":"兌","hi":"坎","gua":"亨。苦節，不可貞。","lines":["初九：不出戶庭，无咎。","九二：不出門庭，凶。","六三：不節若，則嗟若，无咎。","六四：安節。亨。","九五：甘節，吉，往有尚。","上六：苦節，貞凶。悔亡。"],"use":null,"xiang":"澤上有水，《節》。君子以制數度，議德行。","bh":{"gua":["亨通；过度节制不可长久坚持。","有节制，但别太苛刻。"],"lines":[["不出户庭，没有过错。","现在该待着。"],["不出门庭，凶。","该出去了还不动，会错过。"],["不节制，就会叹息，无可怪罪别人。","放纵过后，自己后悔。"],["安于节制，亨通。","自在地节制最好。"],["以节制为乐，吉，前往会受尊崇。","甘心自律，人人敬重。"],["过度节制，守正也凶，悔恨消失。","对自己别太狠。"]],"use":null}},"110011":{"n":61,"name":"中孚","sym":"䷼","lo":"兌","hi":"巽","gua":"豚魚，吉。利涉大川，利貞。","lines":["初九：虞吉，有它不燕。","九二：鳴鶴在陰，其子和之。我有好爵，吾與爾靡之。","六三：得敵，或鼓或罷，或泣或歌。","六四：月幾望，馬匹亡，无咎。","九五：有孚攣如，无咎。","上九：翰音登于天，貞凶。"],"use":null,"xiang":"澤上有風，《中孚》。君子以議獄緩死。","bh":{"gua":["诚信感及小猪小鱼，吉；利于渡大河，利于守正。","真诚能打动一切。"],"lines":[["安守诚信吉，有别的心思就不安。","专一才安心。"],["鹤在树荫下鸣叫，小鹤应和；我有美酒，愿与你共饮。","真心相待，自然呼应。"],["遇到对手，时而击鼓时而罢休，时而哭泣时而歌唱。","情绪起伏，别被对手牵着走。"],["月近圆，马匹走失，没有过错。","放弃一些，保全大局。"],["有诚信牵系人心，没有过错。","用信任凝聚人。"],["鸡鸣声想飞上天，守正也凶。","虚张声势，不能长久。"]],"use":null}},"001100":{"n":62,"name":"小過","sym":"䷽","lo":"艮","hi":"震","gua":"亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。","lines":["初六：飛鳥以凶。","六二：過其祖，遇其妣。不及其君，遇其臣。无咎。","九三：弗過、防之，從或戕之，凶。","九四：无咎。弗過、遇之，往厲必戒。勿用永貞。","六五：密雲不雨，自我西郊。公弋取彼在穴。","上六：弗遇、過之，飛鳥離之，凶，是謂災眚。"],"use":null,"xiang":"山上有雷，《小過》。君子以行過乎恭，喪過乎哀，用過乎儉。","bh":{"gua":["亨通，利于守正；可做小事，不可做大事；飞鸟留下声音，不宜向上，宜向下，大吉。","小事可以做，大事先放一放。"],"lines":[["飞鸟一味向上飞，因此凶。","别好高骛远。"],["越过祖父，遇到祖母；不越级去见君主，而遇见臣子，没有过错。","按规矩来，别越级。"],["不过分防备，反而被跟从者伤害，凶。","该防的要防。"],["没有过错；不过分而适度相遇，前往有危险必须戒备，不要长久固守。","适可而止，灵活应变。"],["浓云密布不下雨，从我的西郊升起；王公射取洞穴里的猎物。","时机未到，先抓小目标。"],["不适度相遇而过分，飞鸟被网住，凶，这叫灾祸。","过头了，会惹祸。"]],"use":null}},"101010":{"n":63,"name":"既濟","sym":"䷾","lo":"離","hi":"坎","gua":"亨。小利貞。初吉終亂。","lines":["初九：曳其輪，濡其尾，无咎。","六二：婦喪其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，終日戒。","九五：東鄰殺牛，不如西鄰之禴祭實受其福。","上六：濡其首，厲。"],"use":null,"xiang":"水在火上，《既濟》。君子以思患而豫防之。","bh":{"gua":["亨通，小有利于守正；开始吉，最后会乱。","事已成，防止后来出乱。"],"lines":[["拖住车轮，打湿尾巴，没有过错。","放慢一点，没坏处。"],["妇人丢了车帘，不用找，七天后会找回。","丢了的会回来。"],["高宗讨伐鬼方，三年才攻克，不可任用小人。","大事要耐心，也要用对人。"],["华美的衣服里有破絮，整天都要警戒。","好的时候更要防漏洞。"],["东邻杀牛祭祀，不如西邻简单的祭祀，真正得到福分。","心诚比排场重要。"],["打湿了头，危险。","过头了，赶紧收。"]],"use":null}},"010101":{"n":64,"name":"未濟","sym":"䷿","lo":"坎","hi":"離","gua":"亨。小狐汔濟，濡其尾，无攸利。","lines":["初六：濡其尾，吝。","九二：曳其輪，貞吉。","六三：未濟，征凶。利涉大川。","九四：貞吉，悔亡，震用伐鬼方，三年，有賞于大國。","六五：貞吉，无悔。君子之光，有孚、吉。","上九：有孚于飲酒，无咎。濡其首，有孚失是。"],"use":null,"xiang":"火在水上，《未濟》。君子以慎辨物居方。","bh":{"gua":["亨通；小狐狸快要渡过河，打湿了尾巴，无所利。","快成了，最后一步别松懈。"],"lines":[["打湿了尾巴，难堪。","准备不足，别急着冲。"],["拖住车轮，守正吉。","慢一点，稳住。"],["还没渡过，前往凶，但利于渡大河。","方法对了才能过。"],["守正吉，悔恨消失；奋起讨伐鬼方，三年后获得大国的封赏。","长期努力，终有回报。"],["守正吉，没有悔恨；君子的光辉，有诚信，吉。","你的光芒会被看见。"],["诚信地饮酒，没有过错；喝到湿了头，诚信就失了分寸。","庆祝可以，别过度。"]],"use":null}}}</script>
<script>
const H=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
function verdict(t){
  let s=t.replace(/^[^：]*：/,'');
  const has=re=>re.test(s);
  let pos=0,neg=0,tags=[];
  s=s.replace(/无不利/g,()=>{pos+=2;tags.push('无不利');return ''});
  s=s.replace(/悔亡/g,()=>{tags.push('悔亡');return ''});
  s=s.replace(/无咎/g,()=>{tags.push('无咎');return ''});
  s=s.replace(/无悔/g,()=>{tags.push('无悔');return ''});
  s=s.replace(/无攸利/g,()=>{neg+=2;tags.push('无攸利');return ''});
  s=s.replace(/勿用/g,()=>{neg+=1;tags.push('勿用');return ''});
  s=s.replace(/不利/g,()=>{neg+=1;tags.push('不利');return ''});
  s=s.replace(/[元大]吉/g,()=>{pos+=3;tags.push('大吉');return ''});
  if(has(/吉/)){pos+=2;tags.push('吉')}
  if(has(/凶/)){neg+=3;tags.push('凶')}
  if(has(/厲/)){neg+=1;tags.push('厲')}
  if(has(/吝/)){neg+=1;tags.push('吝')}
  if(has(/悔/)){neg+=1;tags.push('悔')}
  if(has(/利/)){pos+=1;tags.push('利')}
  if(has(/亨/)){pos+=1;tags.push('亨')}
  let lv;
  if(pos>=2&&neg>=3) lv='mixed';
  else if(pos>=3&&neg===0) lv='great';
  else if(pos-neg>=1) lv='good';
  else if(neg>=3) lv='bad';
  else if(neg>pos) lv='caution';
  else lv='even';
  return {lv,tags};
}

const QR=["11111110000100101001001111111", "10000010001000010110101000001", "10111010010110010110001011101", "10111010011111000010001011101", "10111010001100110110001011101", "10000010110110011001001000001", "11111110101010101010101111111", "00000000010111011101100000000", "10010110101010101000010100000", "11000101111001001110111001001", "00010011111001101001110101110", "10111001011111011010001110110", "11100010001010100101111001011", "11001001111101100101010000000", "11010110011001100010011011111", "11100001101000001101000101010", "11101011100011000110010000010", "01011001010001101100011101001", "10111110010000100100001010011", "00011100111100111100100110011", "10101010101100011000111110100", "00000000110100101001100010111", "11111110010100001010101010010", "10000010110000110010100011110", "10111010000000010100111110011", "10111010110011000000001111110", "10111010011011100001000011101", "10000010000110001111101010010", "11111110110101110110111011010"],SITE='https://chaogecodex.github.io/yigua/';
function qrCanvas(px){const n=QR.length,q=2,s=Math.floor(px/(n+2*q)),c=document.createElement('canvas');c.width=c.height=s*(n+2*q);const x=c.getContext('2d');
 x.fillStyle='#FAF9F5';x.fillRect(0,0,c.width,c.height);x.fillStyle='#141413';QR.forEach((r,i)=>{for(let j=0;j<n;j++)if(r[j]==='1')x.fillRect((j+q)*s,(i+q)*s,s,s)});return c}
const VL={great:['大吉','放手去做'],good:['吉','可以推进'],even:['平','成败在人'],caution:['小心','稳着来'],bad:['凶','暂缓为宜'],mixed:['看条件','分情况看']};
const NUM=['初','二','三','四','五','上'];
let lines=[],cur=null;
function rnd(){const a=new Uint8Array(3);crypto.getRandomValues(a);return [...a].map(x=>x&1)}
function bars(vals,mv){return vals.map((v,i)=>`<div class="yao${mv&&mv[i]?' mv':''}">${v?'<i></i>':'<i></i><i></i>'}</div>`).join('')}
function drawHex(){
  const h=$('hex');h.innerHTML='';
  for(let i=0;i<6;i++){const v=lines[i];
    if(v===undefined){h.insertAdjacentHTML('beforeend','<div class="slot"></div>');continue}
    h.insertAdjacentHTML('beforeend',`<div class="yao${v===6||v===9?' mv':''}" aria-label="${NUM[i]}爻">${(v===7||v===9)?'<i></i>':'<i></i><i></i>'}</div>`)}
  $('count').textContent=lines.length<6?`第 ${lines.length+1} 爻，从下往上`:'六爻已成';
  $('toss').disabled=$('all').disabled=lines.length>=6;
}
function toss(){
  if(lines.length>=6)return;
  const c=rnd(),v=c.reduce((s,x)=>s+(x?3:2),0);
  document.querySelectorAll('.coin').forEach((el,i)=>{el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');el.textContent=c[i]?'字':'背';el.classList.toggle('off',!c[i])});
  lines.push(v);drawHex();if(lines.length===6)finish();
}
function finish(){
  $('reset').hidden=false;
  const pat=lines.map(v=>(v===7||v===9)?1:0).join(''),pat2=lines.map(v=>v===9?0:v===6?1:(v===7?1:0)).join('');
  const ben=H[pat],zhi=H[pat2];
  const ch=lines.map((v,i)=>(v===6||v===9)?i:-1).filter(i=>i>=0),still=[0,1,2,3,4,5].filter(i=>!ch.includes(i));
  let main,why,hl={ben:[],zhi:[]};
  switch(ch.length){
    case 0:main=ben.gua;why='无变爻，看本卦卦辞';break;
    case 1:main=ben.lines[ch[0]];why='一爻变，看本卦变爻';hl.ben=ch;break;
    case 2:main=ben.lines[ch[1]];why='二爻变，以上爻为主';hl.ben=ch;break;
    case 3:main=ben.gua;why='三爻变，本卦卦辞为主';break;
    case 4:main=zhi.lines[still[0]];why='四爻变，看之卦下不变爻';hl.zhi=still;break;
    case 5:main=zhi.lines[still[0]];why='五爻变，看之卦不变爻';hl.zhi=still;break;
    case 6:if(ben.use){main=ben.use;why='六爻全变，用'+(ben.n===1?'九':'六')}else{main=zhi.gua;why='六爻全变，看之卦卦辞'}break;
  }
  const bhOf=x=>{for(const g of [ben,zhi]){if(g.gua===x)return g.bh.gua;const i=g.lines.indexOf(x);if(i>=0)return g.bh.lines[i];if(g.use===x)return g.bh.use}return['','']};
  const MB=bhOf(main),V=verdict(main),[vn,vh]=VL[V.lv];
  const q=$('q').value.trim();
  const d=new Date(),ds=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  const benBits=pat.split('').map(Number),mv=lines.map(v=>v===6||v===9);
  cur={ben,zhi,ch,main,why,MB,vn,vh,lv:V.lv,q,ds,benBits,mv};
  const clean=s=>s.replace(/^《[^》]+》/,'');
  const r=$('result');r.hidden=false;
  const block=(g,label,hls)=>`<h2>${label}·${g.name}</h2><div class="txt"><p>卦辞：${g.gua}</p><p class="yb">${g.bh.gua[0]}</p>`+
    g.lines.map((l,i)=>`<p${hls.includes(i)?' class="hl"':''}>${l}</p><p class="yb">${g.bh.lines[i][0]}</p>`).join('')+(g.use?`<p${main===g.use?' class="hl"':''}>${g.use}</p><p class="yb">${g.bh.use[0]}</p>`:'')+`</div>`;
  r.innerHTML=`
  <div class="card t-${V.lv}" id="card">
    <div class="c-tile"><div class="c-hex">${bars(benBits,mv)}</div><div class="c-v">${vn}</div></div>
    <div class="c-body">
      <div class="c-name">${ben.name}${ch.length?' → '+zhi.name:''}<small>${why}</small></div>
      ${q?`<div class="c-q">问：${esc(q)}</div>`:''}
      <div class="c-text">${clean(main)}</div>
      <div class="c-bh">${MB[0]}</div>
      <div class="c-tip">${MB[1]}</div>
      <div class="c-foot"><div><div>一卦 · ${ds}</div><div><b>claude道长</b> · 仅供娱乐</div></div><div class="c-qr"><span>扫码来一卦</span><img alt="二维码" src="${qrCanvas(240).toDataURL()}"></div></div>
    </div>
  </div>
  <div class="row"><button id="save">保存卡片图片</button><button id="ask" class="ghost" hidden>结合我的问题再解读</button></div>
  <div id="ai" class="ai" hidden></div>
  <details><summary>展开完整卦文与白话</summary>${block(ben,'本卦',hl.ben)}${ch.length?block(zhi,'之卦',hl.zhi):''}</details>`;
  $('save').onclick=saveCard;
  setupAI();
  r.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- PNG card, drawn on canvas ---------- */
function wrap(ctx,text,x,y,maxW,lh,maxLines){
  let line='',n=0;
  for(const ch of text){const t=line+ch;
    if(ctx.measureText(t).width>maxW&&line&&!'，。；：、！？」』）'.includes(ch)){ctx.fillText(line,x,y);y+=lh;n++;line=ch;if(maxLines&&n>=maxLines-1){/*last line*/}}
    else line=t}
  if(line){ctx.fillText(line,x,y);y+=lh}
  return y;
}
async function renderPNG(){
  try{await document.fonts.ready}catch(e){}
  const W=1080,Hh=1350,c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');
  const F='"Noto Serif SC","Songti SC","STSong",serif',S='"DM Sans",system-ui,sans-serif';
  const TILE={great:'#D97757',good:'#D97757',even:'#E3DACC',mixed:'#E3DACC',caution:'#D4A27F',bad:'#141413'}[cur.lv];
  const TINK=cur.lv==='bad'?'#FAF9F5':'#141413';
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(X,Y,w,h,r):x.rect(X,Y,w,h)};
  x.fillStyle='#FAF9F5';x.fillRect(0,0,W,Hh);
  const TH=580;x.fillStyle=TILE;x.fillRect(0,0,W,TH);
  x.fillStyle='#141413';x.fillRect(0,TH-3,W,3);
  // hexagram
  const P=96,hw=300,bh=38,gap=26,top=(TH-(6*bh+5*gap))/2;
  cur.benBits.forEach((b,i)=>{const yy=top+(5-i)*(bh+gap);const seg=(sx,sw)=>{rr(sx,yy,sw,bh,bh/2);x.fillStyle=TINK;x.fill();
      if(cur.mv[i]){rr(sx+8,yy+8,sw-16,bh-16,(bh-16)/2);x.fillStyle=TILE;x.fill();}};
    if(b)seg(P,hw);else{const w=hw*0.4;seg(P,w);seg(P+hw-w,w)}});
  x.fillStyle=TINK;x.font=`900 250px ${F}`;x.textAlign='right';x.textBaseline='middle';x.fillText(cur.vn.length>2?cur.vn.slice(0,1):cur.vn,W-P,TH/2+8);
  if(cur.vn.length>2){x.font=`900 120px ${F}`;x.fillText(cur.vn.slice(1),W-P,TH/2+170)}
  x.textAlign='left';x.textBaseline='alphabetic';
  let y=TH+100;
  x.fillStyle='#141413';x.font=`900 72px ${F}`;const nm=cur.ben.name+(cur.ch.length?' → '+cur.zhi.name:'');x.fillText(nm,P,y);
  const nw=x.measureText(nm).width;x.fillStyle='#5E5D59';x.font=`400 28px ${S}`;x.fillText(cur.why,P+nw+28,y-6);
  y+=58;
  if(cur.q){x.font=`400 30px ${S}`;y=wrap(x,'问：'+cur.q,P,y,W-2*P,42)+6}
  x.fillStyle='#141413';x.font=`600 40px ${F}`;y=wrap(x,cur.main.replace(/^《[^》]+》/,''),P,y+10,W-2*P,58);
  x.fillStyle='#5E5D59';x.font=`400 31px ${F}`;y=wrap(x,cur.MB[0],P,y+6,W-2*P,46);
  x.fillStyle='#B5563A';x.font=`900 48px ${F}`;const TW=W-2*P-230,tl=Math.ceil(x.measureText(cur.MB[1]).width/TW);
  wrap(x,cur.MB[1],P,Math.max(y+60,Hh-300-(tl-1)*64),TW,64);
  const qs=196,qc=qrCanvas(qs);x.drawImage(qc,W-P-qc.width+14,Hh-60-qc.width+14);
  x.font=`500 30px ${S}`;x.fillStyle='#141413';x.textAlign='right';x.fillText('扫码来一卦',W-P-qc.width+2,Hh-120);
  x.font=`400 24px ${S}`;x.fillStyle='#5E5D59';x.fillText('免费 · 不用注册',W-P-qc.width+2,Hh-82);x.textAlign='left';
  x.font=`400 26px ${S}`;x.fillStyle='#5E5D59';x.fillText('一卦 · '+cur.ds,P,Hh-120);
  x.fillStyle='#141413';x.font=`700 26px ${S}`;x.fillText('claude道长',P,Hh-82);const w1=x.measureText('claude道长').width;
  x.fillStyle='#5E5D59';x.font=`400 26px ${S}`;x.fillText(' · 仅供娱乐',P+w1,Hh-82);
  return new Promise(res=>c.toBlob(b=>res({blob:b,url:c.toDataURL('image/png')}),'image/png'));
}
let dl;const dlReady=(window.claude&&claude.use)?claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function saveCard(){
  const b=$('save');b.disabled=true;b.textContent='生成中…';
  try{
    const {blob,url}=await renderPNG();const name=`一卦-${cur.ben.name}.png`;
    dl=await dlReady;
    if(dl){try{await dl.save({filename:name,data:blob});b.textContent='已保存';return}catch(e){if(e&&e.code==='declined')return}}
    // ordinary browser: trigger a real file download first
    try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){}
    // then show the image with share / download options as a fallback
    $('shotimg').src=url;$('shotdl').href=url;$('shotdl').download=name;
    const f=new File([blob],name,{type:'image/png'});const canShare=!!(navigator.canShare&&navigator.canShare({files:[f]}));
    $('shotshare').hidden=!canShare;$('shotshare').onclick=async()=>{try{await navigator.share({files:[f]})}catch(e){}};
    $('shot').classList.add('on');
  }finally{b.disabled=false;b.textContent='保存卡片图片'}
}
$('shotclose').onclick=()=>$('shot').classList.remove('on');

const smp=(window.claude&&claude.use)?claude.use('sample').catch(()=>null):Promise.resolve(null);
async function setupAI(){
  const sample=await smp,ask=$('ask'),out=$('ai');if(!sample||!ask)return;ask.hidden=false;
  ask.onclick=async()=>{ask.disabled=true;out.hidden=false;out.textContent='Claude 正在读卦…';
    const k=cur,q=k.q||'（没有说具体问题）';

    try{await sample(prompt,{onText:({text})=>{out.textContent=text}})}

}
